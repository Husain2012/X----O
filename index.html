<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>لعبة XO أونلاين جماعية</title>
<style>
/* ===========================
   متغيرات عامة (Light / Dark)
   =========================== */
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --muted:#6b7280;
  --accent:#6c5ce7;
  --accent-2:#00b894;
  --danger:#ff6b6b;
  --glass: rgba(255,255,255,0.6);
  --shadow: 0 6px 18px rgba(15,23,42,0.08);
  --radius:12px;
  --text:#0f172a;

  --max-app-width:1100px;
  --sidebar-width:320px;
  --gap:18px;
  --cell-gap:10px;
  --ui-padding:18px;
}

:root.dark{
  --bg:#0b1020;
  --card:#0f1726;
  --muted:#9aa4b2;
  --accent:#7c5cff;
  --accent-2:#00d28a;
  --danger:#ff7b7b;
  --glass: rgba(255,255,255,0.03);
  --shadow: 0 8px 30px rgba(2,6,23,0.6);
  --text:#e6eef8;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: linear-gradient(180deg,var(--bg), #e9eef8 60%);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  display:flex;
  align-items:stretch;
  min-height:100vh;
  padding:20px;
}

.app{
  margin:auto;
  width:100%;
  max-width:var(--max-app-width);
  display:grid;
  grid-template-columns: 1fr minmax(260px, var(--sidebar-width));
  gap:var(--gap);
  padding:var(--ui-padding);
}

.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:8px;
}
.brand{display:flex;gap:12px;align-items:center}
.logo{
  width:48px;height:48px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),#4f46e5);
  display:flex;align-items:center;justify-content:center;color:white;font-weight:700;
  box-shadow:0 6px 18px rgba(79,70,229,0.18);
  font-size:18px;
}
.title{font-size:clamp(16px,1.6vw,20px);font-weight:700}
.subtitle{font-size:clamp(12px,1.2vw,14px);color:var(--muted)}

.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.input, .btn, .select {
  border-radius:10px;
  padding:10px 12px;
  border:1px solid rgba(15,23,42,0.06);
  background:transparent;
  font-size:clamp(13px,1.2vw,15px);
  color:var(--text);
}
.input::placeholder{color:var(--muted)}
.btn{
  background:linear-gradient(90deg,var(--accent),#4f46e5);
  color:white;border:0;cursor:pointer;
  box-shadow:0 8px 20px rgba(79,70,229,0.12);
}
.btn.ghost{
  background:transparent;color:var(--text);border:1px solid rgba(15,23,42,0.06);
  box-shadow:none;
}
.small{padding:8px 10px;font-size:13px}

.board-wrap{
  display:flex;
  gap:var(--gap);
  align-items:flex-start;
  flex-wrap:wrap;
}

.game-panel{
  flex:1 1 420px;
  min-width:260px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.info-panel{
  width:var(--sidebar-width);
  min-width:220px;
}

.board{
  width:100%;
  max-width:min(560px, calc(100vw - var(--sidebar-width) - 80px));
  aspect-ratio:1/1;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:var(--cell-gap);
  padding:var(--cell-gap);
  border-radius:14px;
  background:linear-gradient(180deg,var(--glass), rgba(255,255,255,0.02));
  border:1px solid rgba(15,23,42,0.04);
  margin:auto;
  position:relative;
}

.cell{
  background:transparent;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(28px, 6.5vmin, 56px);
  font-weight:800;
  color:var(--text);
  cursor:pointer;
  transition:transform .12s ease, background .12s ease;
  user-select:none;
  -webkit-user-select:none;
  min-height:0;
  aspect-ratio:1/1;
  touch-action:manipulation;
  -webkit-tap-highlight-color: transparent;
}
.cell:hover{transform:translateY(-4px)}
.cell.disabled{cursor:not-allowed;opacity:0.6;transform:none}
.cell.x{color:var(--accent)}
.cell.o{color:var(--accent-2)}

.status{
  display:flex;
  align-items:center;
  gap:12px;
  justify-content:space-between;
  margin-bottom:6px;
}
.players{display:flex;gap:8px;align-items:center}
.player{
  display:flex;
  gap:8px;
  align-items:center;
  padding:8px 10px;
  border-radius:10px;
  background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  border:1px solid rgba(15,23,42,0.03);
}
.avatar{
  width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#fff,rgba(255,255,255,0.02));
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text);
}
.turn{font-weight:700;color:var(--muted)}

.rooms-list{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto;padding-right:6px}
.room-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);border:1px solid rgba(15,23,42,0.03)}
.room-meta{display:flex;gap:8px;align-items:center}
.room-name{font-weight:700}
.room-players{font-size:13px;color:var(--muted)}
.badge{padding:6px 8px;border-radius:999px;font-size:12px;background:rgba(0,0,0,0.04)}
.badge.open{background:linear-gradient(90deg,#d1fae5,#bbf7d0);color:#065f46}
.badge.full{background:linear-gradient(90deg,#fee2e2,#fecaca);color:#7f1d1d}

.footer-actions{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px}
.alert{padding:10px;border-radius:10px;background:linear-gradient(90deg, rgba(255,255,255,0.02), transparent);border:1px solid rgba(15,23,42,0.03);color:var(--muted)}

.switch{display:inline-flex;align-items:center;gap:8px}
.toggle{width:44px;height:26px;border-radius:999px;background:rgba(15,23,42,0.06);position:relative;cursor:pointer}
.toggle .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:white;transition:left .18s ease;box-shadow:0 4px 12px rgba(2,6,23,0.12)}
.toggle.on{background:linear-gradient(90deg,var(--accent),#4f46e5)}
.toggle.on .knob{left:21px}

@media (max-width:980px){
  body{padding:12px}
  .app{grid-template-columns:1fr;gap:12px;padding:12px;}
  .info-panel{width:100%;order:3;}
  .game-panel{order:1}
  .board{max-width:100%;padding:12px;}
  .controls{gap:8px}
}

@media (max-width:520px){
  .header{flex-direction:column;align-items:flex-start;gap:8px}
  .controls{width:100%;justify-content:flex-start}
  .input{flex:1 1 auto;min-width:120px}
  .btn.small{padding:10px 12px}
  .cell{font-size:clamp(26px, 9vmin, 48px)}
  .room-item{padding:12px}
}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="main card" style="display:flex;flex-direction:column;gap:12px">
    <div class="header">
      <div class="brand">
        <div class="logo">XO</div>
        <div>
          <div class="title">لعبة XO أونلاين جماعية</div>
          <div class="subtitle">مزامنة فورية عبر سحابة Firebase الخاصة بك</div>
        </div>
      </div>

      <div class="controls">
        <input id="playerName" class="input" placeholder="اسمك (مثال: حسين)" maxlength="18" />
        <button id="createRoomBtn" class="btn small">إنشاء غرفة جديدة</button>
        <input id="joinRoomId" class="input" placeholder="رمز الغرفة" style="width:170px" />
        <button id="joinRoomBtn" class="btn ghost small">انضم</button>
        <div class="switch" title="تبديل الوضع الداكن">
          <div id="darkToggle" class="toggle" role="switch" aria-checked="false">
            <div class="knob"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="board-wrap">
      <div class="game-panel card">
        <div class="status">
          <div class="players">
            <div class="player" id="playerInfo">
              <div class="avatar" id="myAvatar">ح</div>
              <div>
                <div id="myName" style="font-weight:700">غير مسجل</div>
                <div style="font-size:12px;color:var(--muted)">أنت</div>
              </div>
            </div>
            <div class="player" id="opponentInfo" style="display:none">
              <div class="avatar" id="oppAvatar">م</div>
              <div>
                <div id="oppName" style="font-weight:700">لاعب آخر</div>
                <div style="font-size:12px;color:var(--muted)">خصم</div>
              </div>
            </div>
          </div>

          <div style="text-align:right">
            <div class="turn" id="turnText">غير متصل</div>
            <div style="font-size:12px;color:var(--muted)">حالة الغرفة</div>
          </div>
        </div>

        <div id="board" class="board"></div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
          <div class="controls-row">
            <button id="resetBtn" class="btn ghost small">إعادة ضبط الغرفة</button>
            <button id="rematchBtn" class="btn small" disabled>إعادة اللعب</button>
          </div>
          <div style="font-size:13px;color:var(--muted)"><span id="roomIdDisplay">غير متصل</span></div>
        </div>

        <div id="message" class="alert" style="margin-top:12px">مرحباً! أنشئ غرفة أو انضم للبدء أونلاين.</div>
      </div>

      <div class="info-panel card sidebar">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:700">قائمة الغرف أونلاين</div>
          <div style="font-size:13px;color:var(--muted)"><span id="roomsCount">0</span></div>
        </div>

        <div id="roomsList" class="rooms-list"></div>

        <div class="footer-actions">
          <div style="font-size:13px;color:var(--muted)">مزامنة حية من السيرفر السحابي</div>
          <button id="clearRoomsBtn" class="btn ghost small">تنظيف غرف السيرفر</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAO0ji6BcUlnkiewRjayAU6rDz2QDla9zY",
  authDomain: "xo-online-94196.firebaseapp.com",
  databaseURL: "https://xo-online-94196-default-rtdb.firebaseio.com", 
  projectId: "xo-online-94196",
  storageBucket: "xo-online-94196.firebasestorage.app",
  messagingSenderId: "314225204059",
  appId: "1:314225204059:web:9310352e417b8321ca987e",
  measurementId: "G-7WKWV7WQ9R"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* عناصر الواجهة */
const playerNameInput = document.getElementById('playerName');
const createRoomBtn = document.getElementById('createRoomBtn');
const joinRoomIdInput = document.getElementById('joinRoomId');
const joinRoomBtn = document.getElementById('joinRoomBtn');
const roomsListEl = document.getElementById('roomsList');
const roomsCountEl = document.getElementById('roomsCount');
const boardEl = document.getElementById('board');
const messageEl = document.getElementById('message');
const roomIdDisplay = document.getElementById('roomIdDisplay');
const myNameEl = document.getElementById('myName');
const myAvatarEl = document.getElementById('myAvatar');
const oppNameEl = document.getElementById('oppName');
const oppAvatarEl = document.getElementById('oppAvatar');
const opponentInfoEl = document.getElementById('opponentInfo');
const rematchBtn = document.getElementById('rematchBtn');
const resetBtn = document.getElementById('resetBtn');
const clearRoomsBtn = document.getElementById('clearRoomsBtn');
const turnTextEl = document.getElementById('turnText');
const darkToggle = document.getElementById('darkToggle');

let state = {
  playerId: null,
  playerName: '',
  currentRoom: null,
  rooms: {},
  board: Array(9).fill(null),
  mySymbol: null,
  turn: null,
  gameActive: false,
  winner: null
};

function genId(){ return Math.random().toString(36).slice(2,6).toUpperCase(); }
function genPlayerId(){ return 'p_' + Math.random().toString(36).slice(2,9); }

function initPlayer(){
  const savedName = localStorage.getItem('xo_player_name');
  if (savedName) playerNameInput.value = savedName;
  let pid = sessionStorage.getItem('xo_player_id');
  if (!pid){ pid = genPlayerId(); sessionStorage.setItem('xo_player_id', pid); }
  state.playerId = pid;
  updatePlayerUI();
}

function updatePlayerUI(){
  const name = playerNameInput.value.trim() || 'لاعب';
  state.playerName = name;
  myNameEl.textContent = name;
  myAvatarEl.textContent = name.charAt(0) || 'ل';
  localStorage.setItem('xo_player_name', name);
}

/* إصلاح دالة إنشاء الغرفة */
function createRoom(){
  const id = genId();
  const roomRef = ref(db, 'rooms/' + id);
  const roomData = { 
    id, 
    createdAt: Date.now(), 
    players:[{id: state.playerId, name: state.playerName}], 
    status: 'open', 
    board: Array(9).fill(""), 
    turn: 'X'
  };
  
  set(roomRef, roomData).then(() => {
    joinRoom(id);
  }).catch((err) => {
    showMessage("فشل الاتصال بقاعدة البيانات. تأكد من تفعيل قواعد الحماية (Rules).", true);
  });
}

function joinRoom(id){
  const roomRef = ref(db, 'rooms/' + id);
  get(roomRef).then((snapshot) => {
    const room = snapshot.val();
    if (!room){ showMessage('الغرفة غير موجودة.', true); return; }
    if (!room.players) room.players = [];
    
    if (!room.players.find(p => p.id === state.playerId)){
      if (room.players.length >= 2){ showMessage('الغرفة ممتلئة.', true); return; }
      room.players.push({id: state.playerId, name: state.playerName});
      room.status = 'playing';
      room.board = Array(9).fill("");
      room.turn = 'X';
      set(roomRef, room);
    }
    state.currentRoom = room;
    updateRoomUI();
  });
}

function renderBoard(){
  boardEl.innerHTML = '';
  for (let i=0; i<9; i++){
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.index = i;
    const val = state.board[i];
    if (val && val !== ""){ 
      cell.textContent = val; 
      cell.classList.add(val.toLowerCase()); 
      cell.classList.add('disabled'); 
    }
    cell.onclick = onCellClick;
    boardEl.appendChild(cell);
  }
  updateTurnUI();
}

function onCellClick(e){
  const idx = Number(e.currentTarget.dataset.index);
  if (!state.currentRoom){ showMessage('انضم إلى غرفة أولاً.', true); return; }
  if (!state.gameActive){ showMessage('اللعبة انتهت أو لم تبدأ بعد.', true); return; }
  if (state.turn !== state.mySymbol){ showMessage('ليس دورك الآن!', true); return; }
  if (state.board[idx] && state.board[idx] !== ""){ return; }
  
  state.board[idx] = state.mySymbol;
  const nextTurn = (state.turn === 'X') ? 'O' : 'X';
  
  const roomRef = ref(db, 'rooms/' + state.currentRoom.id);
  update(roomRef, {
    board: state.board,
    turn: nextTurn
  });
}

function evaluateGameLocal(){
  const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for (const [a,b,c] of lines){
    if (state.board[a] && state.board[a] !== "" && state.board[a]===state.board[b] && state.board[a]===state.board[c]){
      state.winner = state.board[a]; 
      state.gameActive = false;
      showMessage(state.winner === state.mySymbol ? "تهانينا! لقد فزت باللقب 🎉" : `للأسف خَسرت، الفائز هو الخصم (${state.winner})`);
      rematchBtn.disabled = false;
      return true;
    }
  }
  if (state.board.every(x=> x && x!=="")){ 
    state.winner = 'draw'; 
    state.gameActive = false; 
    rematchBtn.disabled = false; 
    showMessage('تعادل قوي بين الطرفين! 🙌'); 
    return true; 
  }
  state.winner = null; 
  rematchBtn.disabled = true; 
  return false;
}

function updateTurnUI(){
  if (!state.currentRoom){ turnTextEl.textContent='غير متصل'; roomIdDisplay.textContent='غير متصل'; opponentInfoEl.style.display='none'; rematchBtn.disabled=true; return; }
  roomIdDisplay.textContent = `رمز الغرفة: ${state.currentRoom.id}`;
  const players = state.currentRoom.players || [];
  const opp = players.find(p=>p.id!==state.playerId);
  if (opp){ opponentInfoEl.style.display='flex'; oppNameEl.textContent = opp.name; oppAvatarEl.textContent = opp.name.charAt(0) || 'م'; } else { opponentInfoEl.style.display='none'; }
  
  if (state.gameActive) {
    turnTextEl.textContent = (state.turn === state.mySymbol) ? "دورك الآن! ⚡" : "دور الخصم..⏳";
  } else {
    turnTextEl.textContent = (state.currentRoom.status === 'open') ? 'بانتظار لاعب آخر' : 'انتهت اللعبة';
  }
}

function updateRoomUI(){
  updatePlayerUI();
  if (!state.currentRoom){ renderBoard(); return; }
  const players = state.currentRoom.players || [];
  const idx = players.findIndex(p=>p.id===state.playerId);
  state.mySymbol = (idx===0)?'X':'O';
  
  const opp = players.find(p=>p.id!==state.playerId);
  if(opp){ opponentInfoEl.style.display = 'flex'; oppNameEl.textContent = opp.name; oppAvatarEl.textContent = opp.name.charAt(0); } else { opponentInfoEl.style.display = 'none'; }
  renderBoard();
}

function renderRoomsList(){
  roomsListEl.innerHTML = '';
  const roomsArr = Object.values(state.rooms).sort((a,b)=>b.createdAt - a.createdAt);
  roomsCountEl.textContent = roomsArr.length;
  if (roomsArr.length===0){ 
    const empty = document.createElement('div'); empty.className='alert'; empty.textContent='لا توجد غرف حالياً.'; roomsListEl.appendChild(empty); return; 
  }
  roomsArr.forEach(room => {
    const el = document.createElement('div'); el.className='room-item';
    const meta = document.createElement('div'); meta.className='room-meta';
    const name = document.createElement('div'); name.className='room-name'; name.textContent = `غرفة ${room.id}`;
    const playersStr = room.players ? room.players.map(p=>p.name).join(' ضد ') : 'فارغة';
    const players = document.createElement('div'); players.className='room-players'; players.textContent = playersStr;
    meta.appendChild(name); meta.appendChild(players);
    
    const right = document.createElement('div'); right.style.display='flex'; right.style.gap='8px'; right.style.alignItems='center';
    const isFull = room.players && room.players.length >= 2;
    const badge = document.createElement('div'); badge.className='badge ' + (isFull ? 'full' : 'open'); badge.textContent = isFull ? 'ممتلئة' : 'متاحة';
    const joinBtn = document.createElement('button'); joinBtn.className='btn small'; joinBtn.textContent='انضم';
    if(isFull) joinBtn.disabled = true;
    joinBtn.onclick = ()=>{ if (!playerNameInput.value.trim()){ showMessage('أدخل اسمك أولاً.', true); return; } joinRoom(room.id); };
    
    right.appendChild(badge); right.appendChild(joinBtn);
    el.appendChild(meta); el.appendChild(right);
    roomsListEl.appendChild(el);
  });
}

function showMessage(text, isError=false){ messageEl.textContent = text; messageEl.style.color = isError ? 'var(--danger)' : 'var(--text)'; }

createRoomBtn.addEventListener('click', ()=>{ 
  if (!playerNameInput.value.trim()){ showMessage('أدخل اسمك أولاً قبل إنشاء الغرفة.', true); return; } 
  createRoom(); 
});

joinRoomBtn.addEventListener('click', ()=>{ 
  const id = joinRoomIdInput.value.trim().toUpperCase(); 
  if (!id){ showMessage('أدخل رمز الغرفة للانضمام.', true); return; } 
  joinRoom(id); 
});

resetBtn.addEventListener('click', ()=>{ 
  if (!state.currentRoom) return;
  const roomRef = ref(db, 'rooms/' + state.currentRoom.id);
  update(roomRef, { board: Array(9).fill(""), turn: 'X', status: 'playing' });
});

clearRoomsBtn.addEventListener('click', ()=>{ 
  if (!confirm('هل تريد مسح جميع الغرف الحالية؟')) return;
  remove(ref(db, 'rooms'));
  state.currentRoom = null;
  updateRoomUI();
});

/* تفعيل وضع الـ Dark Mode */
function setDarkMode(on){ if (on){ document.documentElement.classList.add('dark'); darkToggle.classList.add('on'); localStorage.setItem('xo_dark','1'); } else { document.documentElement.classList.remove('dark'); darkToggle.classList.remove('on'); localStorage.removeItem('xo_dark'); } }
darkToggle.addEventListener('click', ()=> setDarkMode(!darkToggle.classList.contains('on')));
if (localStorage.getItem('xo_dark')) setDarkMode(true);

/* الاستماع للتغييرات الفورية */
function listenToFirebase(){
  onValue(ref(db, 'rooms'), (snapshot) => {
    state.rooms = snapshot.val() || {};
    renderRoomsList();
    
    if (state.currentRoom && state.rooms[state.currentRoom.id]) {
      const activeRoom = state.rooms[state.currentRoom.id];
      state.currentRoom = activeRoom;
      state.board = activeRoom.board ? activeRoom.board.slice() : Array(9).fill("");
      state.turn = activeRoom.turn;
      state.gameActive = (activeRoom.status === 'playing');
      
      updateRoomUI();
      evaluateGameLocal();
    }
  });
}

initPlayer();
